<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Data Science</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

<header class="hero">
  <h1>Data Science</h1>
  <p class="subtitle">Projects, cool applications and personal thoughts!</p>
</header>

<!-- 🗂️ GRID LAYOUT: Sidebar + Blog Content -->
<div class="layout-wrapper">
  
  <!-- Sidebar Filters -->
  <aside class="sidebar">
    <h3>Filter Content</h3>
    
    <div class="filter-group">
      <h4>Type</h4>
      <label><input type="radio" name="type" value="All" checked> All</label>
      <label><input type="radio" name="type" value="Project"> Projects</label>
      <label><input type="radio" name="type" value="Short Essay"> Short Essays</label>
      <label><input type="radio" name="type" value="Other"> Other</label>
    </div>

    <div class="filter-group">
      <h4>Time Period</h4>
      <div class="date-range">
        <label for="start-month">From:</label>
        <input type="month" id="start-month">
      </div>
      <div class="date-range">
        <label for="end-month">To:</label>
        <input type="month" id="end-month">
      </div>
    </div>
  </aside>

  <!-- Blog Posts -->
  <main class="blog-container" id="blog">
    <!-- Projects injected dynamically -->
  </main>

</div>

<footer>
  <p>© 2026</p>
</footer>

<script src="posts.js"></script>

<script>
const container = document.getElementById("blog");
  const typeInputs = document.querySelectorAll('input[name="type"]');
  const startInput = document.getElementById("start-month");
  const endInput = document.getElementById("end-month");

  // Helper to convert "May 2026" to "2026-05"
  const monthMap = {
    "January": "01", "February": "02", "March": "03", "April": "04",
    "May": "05", "June": "06", "July": "07", "August": "08",
    "September": "09", "October": "10", "November": "11", "December": "12"
  };

  function parseDateToYM(dateStr) {
    const parts = dateStr.trim().split(" ");
    if (parts.length !== 2) return "";
    return `${parts[1]}-${monthMap[parts[0]]}`;
  }

  // Auto-extract dates to set the calendar limits
  function initializeDates() {
    let allDates = [];
    projects.forEach(p => p.posts.forEach(post => {
      const ym = parseDateToYM(post.date);
      if (ym) allDates.push(ym);
    }));
    
    allDates.sort(); // Sort chronologically
    
    if (allDates.length > 0) {
      const minDate = allDates[0];
      const maxDate = allDates[allDates.length - 1];
      
      startInput.min = minDate;
      startInput.max = maxDate;
      startInput.value = minDate; // Default to earliest post

      endInput.min = minDate;
      endInput.max = maxDate;
      endInput.value = maxDate;   // Default to latest post
    }
  }

  // Renders posts based on active filters
  function renderContent() {
    container.innerHTML = "";
    
    const selectedType = document.querySelector('input[name="type"]:checked').value;
    const startYM = startInput.value || "0000-00";
    const endYM = endInput.value || "9999-99";

    projects.forEach(project => {
      // 1. Filter by Type
      if (selectedType !== "All" && project.type !== selectedType) return;

      // 2. Filter nested posts by Time Range
      let visiblePosts = project.posts.filter(post => {
        const postYM = parseDateToYM(post.date);
        return postYM >= startYM && postYM <= endYM;
      });

      // Skip rendering if project has no posts in this range
      if (visiblePosts.length === 0) return;

      // Build HTML
      const projectEl = document.createElement("section");
      projectEl.className = "project-card card";

      let postsHTML = '<div class="post-list">';
      visiblePosts.forEach(post => {
        postsHTML += `
          <a href="${post.link}" class="post-item">
            <div class="post-item-left">
              ${post.part ? `<span class="post-part">${post.part}:</span>` : ''}
              <span class="post-title">${post.title}</span>
            </div>
            <span class="post-date">${post.date}</span>
          </a>
        `;
      });
      postsHTML += '</div>';

      projectEl.innerHTML = `
        <div class="project-header">
          <h2>${project.title}</h2>
          <p>${project.description}</p>
        </div>
        ${postsHTML}
      `;

      container.appendChild(projectEl);
    });
  }

  // Event Listeners
  typeInputs.forEach(input => input.addEventListener('change', renderContent));
  startInput.addEventListener('change', renderContent);
  endInput.addEventListener('change', renderContent);

  // Initialize and render
  initializeDates();
  renderContent();
</script>

</body>
</html>
